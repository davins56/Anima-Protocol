version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # wrangler is pinned on purpose (scripts/cloudflare/workers-builds-deploy.md,
    # test/wranglerConfig.test.ts). Bump it by hand after checking the deploy guard.
    ignore:
      - dependency-name: wrangler
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-and-yarn:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
