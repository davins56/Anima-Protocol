# Netlify deploy for the Anima Protocol frontend (pnpm monorepo).
# The api-server runs on Replit; /api/* is proxied there (same as vercel.json).
# Set VITE_CLERK_PUBLISHABLE_KEY in the Netlify site UI for production builds.

[build]
  command = "corepack enable && corepack prepare pnpm@10.15.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/anima-protocol run build"
  publish = "artifacts/anima-protocol/dist/public"
  ignore = "true"

[build.environment]
  NETLIFY_USE_PNPM = "true"
  NODE_VERSION = "24"
  PORT = "23660"
  BASE_PATH = "/"
  VITE_CLERK_PROXY_URL = ""
  # Do not default to pk_test_placeholder — its payload decodes to a garbled
  # Clerk host. When unset, App.full.jsx uses the clerk.anima-protocol.com
  # publishable-key fallback. Override in Netlify → Site settings → Environment.

# Deploy previews / branch builds: leave the key unset unless the site UI
# provides a real pk_live/pk_test key. Never bake pk_test_placeholder.

# API → Replit backend (character store, chat, Clerk proxy, etc.)
[[redirects]]
  from = "/api/*"
  to = "https://anima-protocol.replit.app/api/:splat"
  status = 200
  force = true

# SPA fallback (after /api rules)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Algolia Crawler for Netlify. JS rendering is required because the frontend
# is a Vite SPA; without it the crawler only sees the empty #root shell.
# Set VITE_ALGOLIA_SEARCH_API_KEY (search-only key) in Netlify env for the widget.
[[plugins]]
  package = "@algolia/netlify-plugin-crawler"
  [plugins.inputs]
    branches = ["main"]
    renderJavaScript = true
