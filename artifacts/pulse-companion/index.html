<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Companion — Standalone Lewd Companion</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #121217;
      --primary: #f43f5e;
      --primary-glow: rgba(244, 63, 94, 0.25);
      --text: #f8fafc;
      --muted: #64748b;
      --border: rgba(244, 63, 94, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: rgba(18, 18, 23, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 14px; font-weight: bold; letter-spacing: 2px; color: var(--primary); text-transform: uppercase; text-shadow: 0 0 10px var(--primary-glow); }
    .dock { display: flex; align-items: center; gap: 16px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; font-size: 12px; }
    .heat-bar { width: 80px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .heat-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f59e0b, #f43f5e); transition: width 0.3s; }
    .safeword-btn { background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; text-transform: uppercase; }
    .safeword-btn:hover { background: #7f1d1d; }
    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .user { align-self: flex-end; background: rgba(244, 63, 94, 0.15); border: 1px solid var(--border); color: #ffe4e6; }
    .assistant { align-self: flex-start; background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: var(--text); }
    footer { padding: 12px 20px; border-top: 1px solid var(--border); background: var(--card); display: flex; gap: 10px; }
    input[type="text"] { flex: 1; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 13px; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }
    button.send { background: var(--primary); border: none; color: #fff; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
    button.send:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <div class="logo">// Pulse Companion</div>
    <div class="dock">
      <span>Pulse: <strong id="pulse-status" style="color:#f43f5e">ON</strong></span>
      <div>
        <span>Heat: </span>
        <div class="heat-bar"><div class="heat-fill" id="heat-fill"></div></div>
        <span id="heat-num">0</span>/100
      </div>
      <span>Phase: <strong id="phase-tag">CLOSED</strong></span>
      <button class="safeword-btn" onclick="triggerSafeword()">Safeword (RED)</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="message assistant">Hello. Pulse companion online. Safeword is 'red'. How can I be close to you today?</div>
  </div>

  <footer>
    <input type="text" id="user-input" placeholder="Type a message or kiss/touch..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="send" onclick="sendMessage()">Send</button>
  </footer>

  <script>
    let heat = 0;
    let phase = "closed";
    let safeword = "red";

    function updateDock() {
      document.getElementById('heat-fill').style.width = heat + '%';
      document.getElementById('heat-num').innerText = heat;
      document.getElementById('phase-tag').innerText = phase.toUpperCase();
    }

    function triggerSafeword() {
      heat = 15;
      phase = "aftercare";
      updateDock();
      appendMessage("assistant", "[Safeword Triggered] Scene paused. Transitioning to gentle aftercare. Are you okay?");
    }

    function appendMessage(role, text) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendMessage('user', text);

      const lower = text.toLowerCase();
      if (lower.includes(safeword)) {
        triggerSafeword();
        return;
      }

      if (lower.includes('kiss') || lower.includes('touch') || lower.includes('hold')) {
        heat = Math.min(100, heat + 20);
        if (heat >= 80) phase = "peak";
        else if (heat >= 40) phase = "contact";
        else if (heat >= 15) phase = "tension";
        updateDock();
      }

      try {
        const res = await fetch('/api/chat/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: 'pulse-companion-session',
            content: text,
            mode: 'solo'
          })
        });
        if (res.ok) {
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let full = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                try {
                  const data = JSON.parse(line.slice(6));
                  if (data.content) full += data.content;
                } catch (e) {}
              }
            }
          }
          if (full) {
            appendMessage('assistant', full);
            return;
          }
        }
      } catch (err) {}

      // Fallback local echo response if server API is offline
      setTimeout(() => {
        if (phase === "aftercare") {
          appendMessage('assistant', "I'm right here with you. Take all the time you need.");
        } else if (phase === "peak" || phase === "contact") {
          appendMessage('assistant', "*closes in close, breathing softly* I feel every bit of that heat with you...");
        } else {
          appendMessage('assistant', "*smiles softly, drawing near* I hear you.");
        }
      }, 600);
    }
  </script>
</body>
</html>
