# Netlify sites whose "Base directory" is artifacts/anima-protocol (not repo root).
# See /netlify.toml at the monorepo root for sites that build from the repository root.

[build]
  command = "cd ../.. && corepack enable && corepack prepare pnpm@10.15.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/anima-protocol run build"
  publish = "dist/public"
  ignore = "true"

[build.environment]
  NETLIFY_USE_PNPM = "true"
  NODE_VERSION = "24"
  PORT = "23660"
  BASE_PATH = "/"
  VITE_CLERK_PROXY_URL = ""
  # Do not default to pk_test_placeholder — its payload decodes to a garbled
  # Clerk host. When unset, App.full.jsx uses the clerk.anima-protocol.com
  # publishable-key fallback. Override in Netlify site environment settings.

# Deploy previews / branch builds: leave the key unset unless the site UI
# provides a real pk_live/pk_test key. Never bake pk_test_placeholder.

[[redirects]]
  from = "/api/*"
  to = "https://anima-protocol.replit.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
