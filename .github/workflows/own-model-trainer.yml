name: Own model trainer

# Learns the lessons queued in the app and publishes the next version of the
# own model (server/trainer.py). Browsers pick the new version up on their
# next chat. Needs one repository secret: DATABASE_URL (the app's Postgres).
# See docs/own-model.md.
#
# This repository's logs are public: the trainer logs counts and losses
# only, never lesson text.

on:
  schedule:
    - cron: "*/15 * * * *"
  # The api-server starts a run right after a lesson when GITHUB_TRAINER_TOKEN is set.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: own-model-trainer
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Anything to learn?
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Add the DATABASE_URL repository secret to turn on the own-model trainer (docs/own-model.md)."
            echo "work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m venv .venv
          .venv/bin/pip install --quiet "psycopg[binary]>=3.1,<4"
          .venv/bin/python server/trainer.py --check
      - name: Install CPU PyTorch and trainer deps
        if: steps.check.outputs.work == 'true'
        run: |
          .venv/bin/pip install --quiet --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<2.15"
          .venv/bin/pip install --quiet -r server/requirements-trainer.txt
      - name: Learn and publish
        if: steps.check.outputs.work == 'true'
        run: .venv/bin/python server/trainer.py
