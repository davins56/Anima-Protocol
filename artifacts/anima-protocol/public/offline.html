<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090912">
<title>Offline · Anima Protocol</title>
<style>
  html,body{height:100%;margin:0;background:#090912;color:#7dd3fc;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  h1{font-size:14px;letter-spacing:.3em;text-transform:uppercase;margin:0}
  p{font-size:12px;color:rgba(125,211,252,.6);max-width:28rem;line-height:1.6;margin:0}
  button{min-height:44px;padding:0 20px;background:transparent;color:#7dd3fc;border:1px solid rgba(125,211,252,.5);font:inherit;font-size:11px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<main role="status" aria-live="polite">
  <h1>You're offline</h1>
  <p>Anima Protocol needs a connection to open this page. Your companions and conversations are saved on the server and will be here when you reconnect.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online",function(){location.reload()});</script>
</body>
</html>
